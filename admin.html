<!-- Admin Portal Logic -->
    <script>
        let lmsCatalog = [];
        let storeInventory = [];

        function insertHyperlink(textareaId) {
            const textarea = document.getElementById(textareaId);
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);

            if (!selectedText) {
                alert('Please highlight a word or phrase in the text area first before adding a hyperlink.');
                return;
            }

            const url = prompt('Enter the destination URL for "' + selectedText + '":', 'https://');
            if (!url) return;

            const linkedText = `<a href="${url}" target="_blank" class="text-emerald-700 underline font-semibold">${selectedText}</a>`;
            textarea.value = textarea.value.substring(0, start) + linkedText + textarea.value.substring(end);
        }

        function handleProductTypeChange() {
            const type = document.getElementById('store-product-type').value;
            const sizeLabel = document.getElementById('attr-size-label');
            const sizeInput = document.getElementById('attr-sizes');
            const fitLabel = document.getElementById('lbl-fit-dims');

            if (type === 'furniture') {
                sizeLabel.textContent = 'Dimensions (W x D x H)';
                sizeInput.placeholder = 'e.g., 24"W x 26"D x 42"H';
                fitLabel.textContent = 'Dimensions & Clearance';
            } else if (type === 'jewelry' || type === 'safety') {
                sizeLabel.textContent = 'Specifications / Rating';
                sizeInput.placeholder = 'e.g., NIJ Level IIIA';
                fitLabel.textContent = 'Safety Specs / Fit';
            } else {
                sizeLabel.textContent = 'Size Options';
                sizeInput.placeholder = 'S, M, L, XL';
                fitLabel.textContent = 'Fit / Dimensions';
            }
        }

        function addBulletField(containerId, value = '') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'flex gap-2';
            div.innerHTML = `
                <input type="text" value="${value}" placeholder="Add detail bullet..." class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold px-2">&times;</button>
            `;
            container.appendChild(div);
        }

        function getBulletsFromContainer(containerId) {
            const inputs = document.querySelectorAll(`#${containerId} input`);
            return Array.from(inputs).map(i => i.value.trim()).filter(v => v.length > 0);
        }

        function renderLmsCatalog() {
            const listEl = document.getElementById('lms-catalog-list');
            if (!listEl) return;

            if (lmsCatalog.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-500 italic p-4 text-center">No catalog modules available.</p>';
                return;
            }

            listEl.innerHTML = lmsCatalog.map(item => {
                let statusBadgeColor = 'text-emerald-600 bg-emerald-50';
                if (item.status === 'Canceled') statusBadgeColor = 'text-red-600 bg-red-50';
                if (item.status === 'Archived') statusBadgeColor = 'text-slate-600 bg-slate-100';

                return `
                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-lg flex flex-col gap-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-[#1a365d] text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">${item.code}</span>
                                <h5 class="text-xs font-bold text-slate-800 mt-1">${item.title}</h5>
                            </div>
                            <span class="text-[10px] font-bold px-2 py-1 rounded uppercase ${statusBadgeColor}">${item.status}</span>
                        </div>
                        <p class="text-[11px] text-slate-500 line-clamp-1">${item.description || 'No description provided.'}</p>
                        <div class="flex justify-between items-center text-[10px] text-slate-400 border-t border-slate-200 pt-2 mt-1">
                            <span>Credits: ${item.credits} Units</span>
                            <div class="flex gap-2 font-semibold">
                                <button onclick="editModule('${item.id}')" class="text-blue-600 hover:underline uppercase">Edit</button>
                                <button onclick="updateModuleStatus('${item.id}', 'Canceled')" class="text-amber-600 hover:underline uppercase">Cancel</button>
                                <button onclick="updateModuleStatus('${item.id}', 'Archived')" class="text-slate-600 hover:underline uppercase">Archive</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editModule(id) {
            const item = lmsCatalog.find(m => m.id === id);
            if (!item) return;

            document.getElementById('lms-edit-id').value = item.id;
            document.getElementById('lms-code').value = item.code;
            document.getElementById('lms-title').value = item.title;
            document.getElementById('lms-credits').value = item.credits;
            document.getElementById('lms-status-select').value = item.status;
            document.getElementById('lms-desc').value = item.description || '';
            document.getElementById('lms-form-title').textContent = `Edit Module: ${item.code}`;
            document.getElementById('publish-course-btn').textContent = 'Save Changes';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        }

        function resetLmsForm() {
            document.getElementById('lms-edit-id').value = '';
            document.getElementById('lms-code').value = '';
            document.getElementById('lms-title').value = '';
            document.getElementById('lms-credits').value = '3.00';
            document.getElementById('lms-status-select').value = 'Active';
            document.getElementById('lms-desc').value = '';
            document.getElementById('asset-scorm').value = '';
            document.getElementById('asset-doc').value = '';
            document.getElementById('asset-video').value = '';
            document.getElementById('asset-image').value = '';
            document.getElementById('lms-form-title').textContent = 'Publish New Course Module';
            document.getElementById('publish-course-btn').textContent = 'Publish / Save Module';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            document.getElementById('lms-status').textContent = '';
        }

        async function updateModuleStatus(id, newStatus) {
            const { error } = await window.supabaseClient
                .from('lms_courses')
                .update({ status: newStatus })
                .eq('id', id);

            if (error) {
                alert('Error updating status: ' + error.message);
            } else {
                await fetchLmsCourses();
            }
        }

        async function fetchLmsCourses() {
            if (!window.supabaseClient) return;
            const { data, error } = await window.supabaseClient
                .from('lms_courses')
                .select('*')
                .order('code', { ascending: true });

            if (!error && data) {
                lmsCatalog = data;
                renderLmsCatalog();
            }
        }

        async function fetchStoreItems() {
            if (!window.supabaseClient) return;
            const { data, error } = await window.supabaseClient
                .from('store_items')
                .select('*')
                .order('title', { ascending: true });

            if (!error && data) {
                storeInventory = data;
                renderStoreInventory();
            }
        }

        function renderStoreInventory() {
            const listEl = document.getElementById('store-inventory-list');
            if (!listEl) return;

            if (storeInventory.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-500 italic p-4 text-center">No merchandise items in inventory.</p>';
                return;
            }

            listEl.innerHTML = storeInventory.map(item => `
                <div class="bg-slate-50 border border-slate-200 p-4 rounded-lg flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="bg-emerald-800 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">${item.type}</span>
                            <h5 class="text-xs font-bold text-slate-800 mt-1">${item.title}</h5>
                        </div>
                        <span class="text-xs font-bold text-emerald-700">$${item.price}</span>
                    </div>
                    <p class="text-[11px] text-slate-500">Stock: ${item.stock} units | Photos: ${item.photos?.length || 1}</p>
                    <div class="flex justify-end gap-2 text-[10px] font-semibold text-slate-600 border-t border-slate-200 pt-2">
                        <button onclick="deleteStoreItem('${item.id}')" class="text-red-600 hover:underline uppercase">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteStoreItem(id) {
            const { error } = await window.supabaseClient.from('store_items').delete().eq('id', id);
            if (!error) await fetchStoreItems();
        }

        function switchAdminSection(sectionKey) {
            const gridEl = document.getElementById('admin-hub-grid');
            const containerEl = document.getElementById('work-area-container');
            const backBtn = document.getElementById('back-to-hub');

            document.querySelectorAll('.admin-section').forEach(el => el.classList.add('hidden'));

            if (sectionKey === 'hub') {
                gridEl.classList.remove('hidden');
                containerEl.classList.add('hidden');
                backBtn.classList.add('hidden');
            } else {
                gridEl.classList.add('hidden');
                containerEl.classList.remove('hidden');
                backBtn.classList.remove('hidden');
                document.getElementById(`section-${sectionKey}`).classList.remove('hidden');
                if (sectionKey === 'bri') fetchLmsCourses();
                if (sectionKey === 'store') fetchStoreItems();
            }
        }

        // Safe initialization loop ensuring Supabase client is loaded
        async function initApp() {
            if (!window.supabaseClient) {
                setTimeout(initApp, 100);
                return;
            }

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) { 
                window.location.href = 'login.html'; 
                return; 
            }

            await fetchLmsCourses();
            await fetchStoreItems();

            // Publish Course
            document.getElementById('publish-course-btn').addEventListener('click', async () => {
                const editId = document.getElementById('lms-edit-id').value;
                const code = document.getElementById('lms-code').value.trim();
                const title = document.getElementById('lms-title').value.trim();
                const credits = parseFloat(document.getElementById('lms-credits').value) || 3.00;
                const status = document.getElementById('lms-status-select').value;
                const desc = document.getElementById('lms-desc').value.trim();
                const statusEl = document.getElementById('lms-status');

                if (!code || !title) {
                    statusEl.textContent = 'Please provide a course code and title.';
                    statusEl.className = 'text-xs font-semibold text-red-600';
                    return;
                }

                const scormFile = document.getElementById('asset-scorm').files[0]?.name || 'none';
                const docFile = document.getElementById('asset-doc').files[0]?.name || 'none';
                const videoFile = document.getElementById('asset-video').files[0]?.name || 'none';
                const imageFile = document.getElementById('asset-image').files[0]?.name || 'none';

                const assetMeta = { scorm: scormFile, doc: docFile, video: videoFile, image: imageFile };
                const courseId = editId || 'LMS-' + Date.now();

                statusEl.textContent = 'Publishing to Supabase...';
                statusEl.className = 'text-xs font-semibold text-slate-600';

                const { error } = await window.supabaseClient
                    .from('lms_courses')
                    .upsert({ 
                        id: courseId, 
                        code, 
                        title, 
                        credits, 
                        status, 
                        description: desc, 
                        assets: assetMeta 
                    }, { onConflict: 'id' });

                if (error) {
                    statusEl.textContent = 'Error: ' + error.message;
                    statusEl.className = 'text-xs font-semibold text-red-600';
                } else {
                    statusEl.textContent = `Course '${code}' successfully published!`;
                    statusEl.className = 'text-xs font-semibold text-emerald-600';
                    await fetchLmsCourses();
                    resetLmsForm();
                }
            });

            // Save Store Item
            document.getElementById('save-product-btn').addEventListener('click', async () => {
                const title = document.getElementById('store-title').value.trim();
                const price = parseFloat(document.getElementById('store-price').value);
                const stock = parseInt(document.getElementById('store-stock').value) || 0;
                const type = document.getElementById('store-product-type').value;
                const desc = document.getElementById('store-desc').value.trim();
                const colors = document.getElementById('attr-colors').value.trim();
                const sizes = document.getElementById('attr-sizes').value.trim();
                const statusEl = document.getElementById('store-status');

                if (!title || isNaN(price)) {
                    statusEl.textContent = 'Please provide a valid item title and price.';
                    statusEl.className = 'text-xs font-semibold text-red-600';
                    return;
                }

                const photoFiles = document.getElementById('store-photos').files;
                const photoNames = photoFiles.length > 0 ? Array.from(photoFiles).map(f => f.name) : ['default-product.jpg'];

                const bullets = {
                    features: getBulletsFromContainer('features-list'),
                    fit: getBulletsFromContainer('fit-list'),
                    materials: getBulletsFromContainer('materials-list'),
                    shipping: getBulletsFromContainer('shipping-list')
                };

                const itemId = 'STORE-' + Date.now();
                const { error } = await window.supabaseClient
                    .from('store_items')
                    .insert({ id: itemId, title, price, stock, type, description: desc, photos: photoNames, attributes: { colors, sizes }, bullets });

                if (error) {
                    statusEl.textContent = 'Error: ' + error.message;
                    statusEl.className = 'text-xs font-semibold text-red-600';
                } else {
                    statusEl.textContent = `Item '${title}' saved to store!`;
                    statusEl.className = 'text-xs font-semibold text-emerald-600';
                    await fetchStoreItems();
                }
            });

            // Role Updates
            document.getElementById('update-role-btn').addEventListener('click', async () => {
                const email = document.getElementById('target-email').value.trim();
                const newRole = document.getElementById('target-role').value;
                const statusEl = document.getElementById('status-message');

                if (!email) {
                    statusEl.textContent = 'Please enter a valid user email address.';
                    statusEl.className = 'text-xs font-semibold mt-4 text-center text-red-600';
                    return;
                }

                statusEl.textContent = 'Updating privileges...';
                statusEl.className = 'text-xs font-semibold mt-4 text-center text-slate-600';

                const { error } = await window.supabaseClient
                    .from('profiles')
                    .update({ role: newRole })
                    .eq('id', session.user.id);

                if (error) {
                    statusEl.textContent = `Error: ${error.message}`;
                    statusEl.className = 'text-xs font-semibold mt-4 text-center text-red-600';
                } else {
                    statusEl.textContent = `Successfully updated role to '${newRole}'!`;
                    statusEl.className = 'text-xs font-semibold mt-4 text-center text-emerald-600';
                }
            });

            document.getElementById('logout-btn').addEventListener('click', async () => {
                await window.supabaseClient.auth.signOut();
                window.location.href = 'login.html';
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
