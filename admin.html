<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bond & Recovery Institute - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <style>
        /* Dropdown hover behavior */
        .dropdown:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-100 flex flex-col items-center justify-between py-8 px-4">

    <!-- Top Navigation Bar -->
    <nav class="w-full max-w-5xl bg-white text-slate-800 shadow-lg rounded-xl px-6 py-4 mb-8 flex flex-wrap justify-between items-center border border-slate-200">
        <!-- Brand Title / Nav Left -->
        <div class="flex items-center gap-3">
            <span class="font-extrabold tracking-wider text-[#1a365d] uppercase text-sm">BRI Admin Portal</span>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex items-center gap-6 text-sm font-semibold">
            <a href="home.html" class="text-slate-800 hover:text-amber-600 transition">Home</a>

            <!-- News Dropdown -->
            <div class="relative dropdown group py-2">
                <button class="flex items-center gap-1 hover:text-amber-600 transition text-slate-800 focus:outline-none">
                    News
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div class="dropdown-menu absolute hidden bg-white shadow-xl rounded-lg py-2 mt-1 w-48 border border-slate-200 z-50">
                    <a href="news.html#arkansas" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Arkansas</a>
                    <a href="news.html#kansas" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Kansas</a>
                    <a href="news.html#missouri" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Missouri</a>
                    <a href="news.html#oklahoma" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Oklahoma</a>
                </div>
            </div>

            <a href="dashboard.html" class="text-slate-800 hover:text-amber-600 transition">Dashboard</a>
            <a href="admin.html" class="text-[#1a365d] hover:text-amber-600 transition">Admin Panel</a>
            <a href="store.html" class="text-slate-800 hover:text-amber-600 transition">Store</a>
        </div>
    </nav>

    <!-- Admin Dashboard Main Container -->
    <div class="w-full max-w-3xl bg-white text-slate-800 shadow-2xl rounded-2xl p-10 flex flex-col border border-slate-200 mb-8">
        
        <div class="border-b border-slate-200 pb-6 mb-6">
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-[#1a365d] uppercase">
                System Administration
            </h1>
            <p class="text-xs md:text-sm font-semibold tracking-widest text-slate-500 uppercase mt-1">
                Enterprise Privilege & Security Management
            </p>
        </div>

        <!-- Role Assignment Card -->
        <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
            <h2 class="text-lg font-bold text-[#1a365d] mb-4">Assign User Security Role</h2>
            <form id="role-assignment-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">User Email Address</label>
                    <input type="email" id="target-email" required placeholder="student@example.com" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1a365d]">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Select Privilege Level</label>
                    <select id="target-role" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1a365d]">
                        <option value="student">Student</option>
                        <option value="instructor">Instructor</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                <button type="submit" class="bg-[#1a365d] hover:bg-blue-900 text-white font-bold py-3 px-6 rounded-lg transition uppercase text-sm tracking-wider">
                    Update User Privileges
                </button>
            </form>
            <p id="role-status-msg" class="text-sm mt-3 font-semibold"></p>
        </div>

    </div>

    <!-- Footer -->
    <footer class="text-xs text-slate-400 mt-4 text-center">
        &copy; 2026 Bond & Recovery Institute. All rights reserved.
    </footer>

    <!-- Role Assignment Execution Script -->
    <script>
        document.getElementById('role-assignment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailInput = document.getElementById('target-email').value.trim();
            const newRole = document.getElementById('target-role').value;
            const statusMsg = document.getElementById('role-status-msg');

            statusMsg.textContent = "Updating user role in database...";
            statusMsg.className = "text-sm mt-3 font-semibold text-slate-600";

            // Update user role in the Supabase profiles table matching email
            const { data, error } = await supabase
                .from('profiles')
                .update({ role: newRole })
                .eq('email', emailInput)
                .select();

            if (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "text-sm mt-3 font-semibold text-red-600";
            } else if (!data || data.length === 0) {
                statusMsg.textContent = "No user found with that email address in the profiles registry.";
                statusMsg.className = "text-sm mt-3 font-semibold text-amber-600";
            } else {
                statusMsg.textContent = `Success! User ${emailInput} privileges updated to '${newRole}'.`;
                statusMsg.className = "text-sm mt-3 font-semibold text-green-600";
                document.getElementById('target-email').value = '';
            }
        });
    </script>

</body>
</html>
