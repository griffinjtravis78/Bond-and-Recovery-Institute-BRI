<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Bond & Recovery Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-100 flex flex-col justify-between py-10 px-4">

    <div class="max-w-3xl mx-auto w-full bg-white text-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-200">
        <div class="text-center mb-8 border-b pb-4">
            <h1 class="text-2xl font-extrabold text-[#1a365d] uppercase tracking-wide">Secure Order Checkout</h1>
            <p class="text-xs text-slate-500 mt-1">Bond & Recovery Institute E-Commerce & Enrollment Processing</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h3 class="text-sm font-bold text-[#1a365d] uppercase mb-4">Order Summary</h3>
                <div id="cart-items-container" class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-2">
                    <!-- Cart items populated here -->
                </div>
                <div class="border-t pt-3 flex justify-between items-center font-bold text-base text-slate-900">
                    <span>Total Amount:</span>
                    <span id="cart-total" class="text-emerald-700">$0.00</span>
                </div>
            </div>

            <div class="space-y-4 border-t md:border-t-0 md:border-l border-slate-200 md:pl-8 pt-6 md:pt-0">
                <h3 class="text-sm font-bold text-[#1a365d] uppercase mb-4">Payment & Billing</h3>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Cardholder Name</label>
                    <input type="text" id="card-name" required placeholder="Travis J. Griffin" class="w-full border rounded px-3 py-2 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Card Number (Simulation)</label>
                    <input type="text" id="card-num" required placeholder="•••• •••• •••• 4242" class="w-full border rounded px-3 py-2 text-xs font-mono">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Expiration</label>
                        <input type="text" required placeholder="MM/YY" class="w-full border rounded px-3 py-2 text-xs font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">CVC</label>
                        <input type="text" required placeholder="123" class="w-full border rounded px-3 py-2 text-xs font-mono">
                    </div>
                </div>

                <button onclick="processCheckout()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-lg transition uppercase tracking-wider shadow mt-4">
                    Complete Secure Payment
                </button>
                <a href="store.html" class="block text-center text-xs text-slate-500 hover:underline mt-2">&larr; Return to Store</a>
            </div>
        </div>
    </div>

    <footer class="text-xs text-slate-400 text-center mt-8">
        &copy; 2026 Bond & Recovery Institute. All rights reserved.
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('bri_cart')) || [];

        function renderCheckout() {
            const container = document.getElementById('cart-items-container');
            const totalEl = document.getElementById('cart-total');

            if (cart.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 italic">Your order cart is currently empty.</p>';
                totalEl.textContent = '$0.00';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += parseFloat(item.price);
                return `
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded border text-xs">
                        <div>
                            <span class="font-bold text-[#1a365d] block">${item.title}</span>
                            <span class="text-[10px] text-slate-400 uppercase">${item.type}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-emerald-700">$${item.price}</span>
                            <button onclick="removeItem(${index})" class="text-red-500 font-bold hover:text-red-700">&times;</button>
                        </div>
                    </div>
                `;
            }).join('');
            totalEl.textContent = `$${total.toFixed(2)}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('bri_cart', JSON.stringify(cart));
            renderCheckout();
        }

        async function processCheckout() {
            if (cart.length === 0) {
                alert('Your cart is empty.');
                return;
            }

            let attempts = 0;
            while (!window.supabaseClient && attempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            if (!window.supabaseClient) {
                alert('Database connection error.');
                return;
            }

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }

            const total = cart.reduce((sum, i) => sum + parseFloat(i.price), 0);

            // Record order in Supabase
            const { error } = await window.supabaseClient.from('orders').insert([{
                user_id: session.user.id,
                items: cart,
                total_amount: total,
                status: 'Completed'
            }]);

            if (error) {
                alert('Order processing error: ' + error.message);
                return;
            }

            // If courses were purchased, auto-enroll them
            const enrolled = JSON.parse(localStorage.getItem('bri_enrolled_courses')) || ['1', 'MS-BB-101'];
            cart.forEach(item => {
                if (item.type === 'course' && !enrolled.includes(item.id)) {
                    enrolled.push(item.id);
                }
            });
            localStorage.setItem('bri_enrolled_courses', JSON.stringify(enrolled));

            // Clear cart
            localStorage.removeItem('bri_cart');
            alert('Payment successful! Your order has been processed and course enrollments confirmed.');
            window.location.href = 'dashboard.html';
        }

        window.addEventListener('DOMContentLoaded', renderCheckout);
    </script>
</body>
</html>
