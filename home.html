<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bond & Recovery Institute - Professional Compliance & Surety Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dropdown hover behavior */
        .dropdown:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-100 flex flex-col items-center justify-between py-8 px-4">

    <!-- Top Navigation Bar -->
    <nav class="w-full max-w-5xl bg-white text-slate-800 shadow-lg rounded-xl px-6 py-4 mb-8 flex flex-wrap justify-between items-center border border-slate-200">
        <!-- Brand Title / Nav Left -->
        <div class="flex items-center gap-3">
            <span class="font-extrabold tracking-wider text-[#1a365d] uppercase text-sm">BRI Portal</span>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex items-center gap-6 text-sm font-semibold">
            <a href="home.html" class="text-[#1a365d] hover:text-amber-600 transition">Home</a>

            <!-- News Dropdown -->
            <div class="relative dropdown group py-2">
                <button class="flex items-center gap-1 hover:text-amber-600 transition text-slate-800 focus:outline-none">
                    News
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div class="dropdown-menu absolute hidden bg-white shadow-xl rounded-lg py-2 mt-1 w-48 border border-slate-200 z-50">
                    <a href="news.html#arkansas" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Arkansas</a>
                    <a href="news.html#kansas" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Kansas</a>
                    <a href="news.html#missouri" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Missouri</a>
                    <a href="news.html#oklahoma" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Oklahoma</a>
                </div>
            </div>

            <a href="login.html" class="text-[#1a365d] hover:text-amber-600 transition">Bond & Recovery Institute</a>
            <a href="home.html#about" class="text-slate-800 hover:text-amber-600 transition">About Us</a>
            <a href="store.html" class="text-slate-800 hover:text-amber-600 transition">Bond & Recovery Store</a>
        </div>
    </nav>

    <!-- Hero Branding Card with Centered Logo -->
    <div class="w-full max-w-3xl bg-white text-slate-800 shadow-2xl rounded-2xl p-10 flex flex-col items-center text-center border border-slate-200">
        <!-- Official Crest Placeholder -->
        <div class="w-28 h-28 bg-[#1a365d] rounded-full flex items-center justify-center mb-6 shadow-md border-4 border-amber-500">
            <svg class="w-16 h-16 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5"></path>
            </svg>
        </div>

        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-[#1a365d] uppercase mb-2">
            Bond & Recovery Institute
        </h1>
        <p class="text-xs md:text-sm font-semibold tracking-widest text-slate-500 uppercase mb-8">
            Professional Compliance & Surety Training
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
            <a href="login.html" class="bg-[#1a365d] hover:bg-blue-900 text-white font-bold py-3 px-8 rounded-xl shadow transition duration-200 uppercase text-sm tracking-wider">
                Student Sign In
            </a>
            <a href="register.html" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-8 rounded-xl shadow transition duration-200 uppercase text-sm tracking-wider">
                New Student Registration
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-xs text-slate-400 mt-8 text-center">
        &copy; 2026 Bond & Recovery Institute. All rights reserved.
    </footer>

</body>
</html>
