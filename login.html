<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign In - Bond & Recovery Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-900 min-h-screen font-sans text-slate-100 flex flex-col justify-between py-8 px-4">

    <!-- Top Navigation Bar -->
    <nav class="w-full max-w-md mx-auto bg-white text-slate-800 shadow-lg rounded-xl px-6 py-3 mb-6 flex justify-between items-center border border-slate-200">
        <a href="home.html" class="font-extrabold tracking-wider text-[#1a365d] uppercase text-xs">BRI Portal</a>
        <div class="flex items-center gap-3 text-xs font-bold uppercase">
            <a href="home.html" class="text-slate-600 hover:text-amber-600 transition">Home</a>
            <a href="register.html" class="text-amber-600 hover:text-amber-700 transition">Register</a>
        </div>
    </nav>

    <!-- Login Card -->
    <main class="w-full max-w-md mx-auto bg-white text-slate-800 shadow-2xl rounded-2xl p-8 border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-[#1a365d] rounded-full flex items-center justify-center mx-auto mb-3 shadow border-2 border-amber-500">
                <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-[#1a365d] uppercase tracking-wide">Student Sign In</h1>
            <p class="text-xs text-slate-500 mt-1">Access your pre-licensing curriculum, store, and enterprise portal</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="login-email" placeholder="agent@example.com" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-xs text-slate-800 focus:ring-2 focus:ring-[#1a365d]">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-xs text-slate-800 focus:ring-2 focus:ring-[#1a365d]">
            </div>

            <button id="login-btn" class="w-full bg-[#1a365d] hover:bg-blue-900 text-white font-bold py-3 rounded-lg transition uppercase tracking-wider shadow">
                Sign In to Portal
            </button>

            <p id="login-status" class="text-xs font-semibold text-center mt-2"></p>
        </div>

        <div class="mt-6 text-center border-t border-slate-200 pt-4">
            <p class="text-xs text-slate-500">Don't have an active account? <a href="register.html" class="text-amber-600 font-bold hover:underline uppercase">Register New Student</a></p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-xs text-slate-400 mt-8 text-center">
        &copy; 2026 Bond & Recovery Institute. All rights reserved.
    </footer>

    <script>
        async function initLogin() {
            let attempts = 0;
            while (!window.supabaseClient && attempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            if (!window.supabaseClient) {
                document.getElementById('login-status').textContent = 'Error: Supabase client failed to load.';
                document.getElementById('login-status').className = 'text-xs font-semibold text-red-600 text-center';
                return;
            }

            document.getElementById('login-btn').addEventListener('click', async () => {
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const statusEl = document.getElementById('login-status');

                if (!email || !password) {
                    statusEl.textContent = 'Please enter both email and password.';
                    statusEl.className = 'text-xs font-semibold text-red-600 text-center';
                    return;
                }

                statusEl.textContent = 'Authenticating credentials...';
                statusEl.className = 'text-xs font-semibold text-slate-600 text-center';

                const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    statusEl.textContent = 'Sign In Failed: ' + error.message;
                    statusEl.className = 'text-xs font-semibold text-red-600 text-center';
                } else {
                    statusEl.textContent = 'Authentication successful! Redirecting to dashboard...';
                    statusEl.className = 'text-xs font-semibold text-emerald-600 text-center';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initLogin);
    </script>
</body>
</html>
