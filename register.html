<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration & Profile - Bond & Recovery Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body class="bg-slate-100 min-h-screen py-12 px-4 font-sans text-slate-800">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-indigo-950 uppercase tracking-wide">Bond & Recovery Institute</h1>
            <p class="text-sm text-slate-600 mt-1">Student System Registration & Professional Profile Hub</p>
        </div>

        <form id="registration-form" class="space-y-6">
            
            <!-- Credentials / Auth Account -->
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                <h3 class="text-xs font-bold uppercase text-indigo-950">Portal Account Credentials</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Email Address *</label>
                        <input type="email" id="reg-email" required placeholder="agent@example.com" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Password *</label>
                        <input type="password" id="reg-password" required placeholder="••••••••" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none font-mono">
                    </div>
                </div>
            </div>

            <!-- Legal Name Section -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">First Name *</label>
                    <input type="text" id="first-name" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Middle Name / Initial</label>
                    <input type="text" id="middle-name" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Last Name *</label>
                    <input type="text" id="last-name" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                </div>
            </div>

            <!-- Identity & Credentials -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Date of Birth *</label>
                    <input type="date" id="dob" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Driver's License Number *</label>
                    <input type="text" id="dl-number" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">DL Issuing State *</label>
                    <select id="dl-state" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none bg-white">
                        <option value="MO" selected>Missouri (MO)</option>
                        <option value="KS">Kansas (KS)</option>
                        <option value="OK">Oklahoma (OK)</option>
                        <option value="AR">Arkansas (AR)</option>
                        <option value="AL">Alabama (AL)</option>
                        <option value="AK">Alaska (AK)</option>
                        <option value="AZ">Arizona (AZ)</option>
                        <option value="CA">California (CA)</option>
                        <option value="CO">Colorado (CO)</option>
                        <option value="FL">Florida (FL)</option>
                        <option value="IL">Illinois (IL)</option>
                        <option value="IN">Indiana (IN)</option>
                        <option value="IA">Iowa (IA)</option>
                        <option value="KY">Kentucky (KY)</option>
                        <option value="LA">Louisiana (LA)</option>
                        <option value="MI">Michigan (MI)</option>
                        <option value="NE">Nebraska (NE)</option>
                        <option value="OH">Ohio (OH)</option>
                        <option value="TN">Tennessee (TN)</option>
                        <option value="TX">Texas (TX)</option>
                        <option value="WI">Wisconsin (WI)</option>
                    </select>
                </div>
            </div>

            <!-- Optional Professional & Educational Background -->
            <div class="border-t border-slate-200 pt-4 space-y-4">
                <h3 class="text-sm font-bold text-indigo-950 uppercase">Professional & Educational Background (Optional)</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Organization / Bond Agency</label>
                        <input type="text" id="profile-org" placeholder="e.g., Krystal Bail Bonds" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Phone Number</label>
                        <input type="text" id="profile-phone" placeholder="(555) 000-0000" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Certifications & Credentials</label>
                    <input type="text" id="profile-certs" placeholder="e.g., Missouri Certified Recovery Agent, NRA Certified" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Degree Level</label>
                        <select id="profile-degree" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none bg-white">
                            <option value="">Select Degree</option>
                            <option value="Associate's">Associate's Degree</option>
                            <option value="B.S.">Bachelor of Science (B.S.)</option>
                            <option value="B.A.">Bachelor of Arts (B.A.)</option>
                            <option value="Master's">Master's Degree</option>
                            <option value="Ph.D.">Doctorate (Ph.D.)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Area of Study</label>
                        <input type="text" id="profile-study" placeholder="e.g., Public Administration" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">College / Institution</label>
                        <input type="text" id="profile-institution" placeholder="e.g., Walden University" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                    </div>
                </div>
            </div>

            <!-- Physical Address -->
            <div class="border-t border-slate-200 pt-4">
                <h3 class="text-sm font-bold text-indigo-950 uppercase mb-3">Physical Address</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">Street Address *</label>
                        <input type="text" id="phys-street" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">City *</label>
                            <input type="text" id="phys-city" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">State *</label>
                            <input type="text" id="phys-state" value="MO" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-700 mb-1">ZIP *</label>
                            <input type="text" id="phys-zip" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-900 outline-none font-mono">
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" id="register-btn" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded shadow transition uppercase text-xs tracking-wider">Save Profile & Complete Registration</button>
            <p id="reg-status" class="text-xs font-semibold text-center mt-2"></p>
        </form>
    </div>

    <script>
        async function initRegister() {
            let attempts = 0;
            while (!window.supabaseClient && attempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            if (!window.supabaseClient) return;

            // Pre-fill if already logged in
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('reg-email').value = session.user.email;
                document.getElementById('reg-email').disabled = true;
                document.getElementById('reg-password').required = false;
                document.getElementById('reg-password').parentElement.style.display = 'none';

                const { data: profile } = await window.supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
                if (profile) {
                    document.getElementById('first-name').value = profile.first_name || '';
                    document.getElementById('middle-name').value = profile.middle_name || '';
                    document.getElementById('last-name').value = profile.last_name || '';
                    document.getElementById('dob').value = profile.date_of_birth || '';
                    document.getElementById('dl-number').value = profile.drivers_license_number || '';
                    document.getElementById('dl-state').value = profile.dl_state || 'MO';
                    document.getElementById('phys-street').value = profile.physical_street || '';
                    document.getElementById('phys-city').value = profile.physical_city || '';
                    document.getElementById('phys-state').value = profile.physical_state || 'MO';
                    document.getElementById('phys-zip').value = profile.physical_zip || '';
                    document.getElementById('profile-org').value = profile.organization || '';
                    document.getElementById('profile-phone').value = profile.phone || '';
                    document.getElementById('profile-certs').value = profile.certifications || '';
                    document.getElementById('profile-degree').value = profile.degree_level || '';
                    document.getElementById('profile-study').value = profile.area_of_study || '';
                    document.getElementById('profile-institution').value = profile.institution || '';
                }
            }

            document.getElementById('registration-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const statusEl = document.getElementById('reg-status');
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;

                statusEl.textContent = 'Saving profile information...';
                statusEl.className = 'text-xs font-semibold text-slate-600 text-center';

                let userId = session ? session.user.id : null;

                if (!userId) {
                    const { data: authData, error: authError } = await window.supabaseClient.auth.signUp({ email, password });
                    if (authError) {
                        statusEl.textContent = 'Registration Error: ' + authError.message;
                        statusEl.className = 'text-xs font-semibold text-red-600 text-center';
                        return;
                    }
                    userId = authData.user ? authData.user.id : null;
                }

                if (!userId) {
                    statusEl.textContent = 'Error: User ID not found.';
                    statusEl.className = 'text-xs font-semibold text-red-600 text-center';
                    return;
                }

                const randomNum = Math.floor(10000 + Math.random() * 90000);
                const studentId = `BRI-${randomNum}`;

                const profileData = {
                    id: userId,
                    email: email,
                    role: 'student',
                    student_id: studentId,
                    first_name: document.getElementById('first-name').value,
                    middle_name: document.getElementById('middle-name').value || null,
                    last_name: document.getElementById('last-name').value,
                    date_of_birth: document.getElementById('dob').value,
                    drivers_license_number: document.getElementById('dl-number').value,
                    dl_state: document.getElementById('dl-state').value,
                    physical_street: document.getElementById('phys-street').value,
                    physical_city: document.getElementById('phys-city').value,
                    physical_state: document.getElementById('phys-state').value,
                    physical_zip: document.getElementById('phys-zip').value,
                    organization: document.getElementById('profile-org').value || null,
                    phone: document.getElementById('profile-phone').value || null,
                    certifications: document.getElementById('profile-certs').value || null,
                    degree_level: document.getElementById('profile-degree').value || null,
                    area_of_study: document.getElementById('profile-study').value || null,
                    institution: document.getElementById('profile-institution').value || null
                };

                const { error: profileError } = await window.supabaseClient
                    .from('profiles')
                    .upsert([profileData], { onConflict: 'id' });

                if (profileError) {
                    statusEl.textContent = 'Profile Error: ' + profileError.message;
                    statusEl.className = 'text-xs font-semibold text-red-600 text-center';
                    return;
                }

                statusEl.textContent = 'Profile saved successfully! Redirecting to dashboard...';
                statusEl.className = 'text-xs font-semibold text-emerald-600 text-center';
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            });
        }

        window.addEventListener('DOMContentLoaded', initRegister);
    </script>
</body>
</html>
