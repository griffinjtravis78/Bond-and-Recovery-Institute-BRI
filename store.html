<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bond & Recovery Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        .dropdown:hover .dropdown-menu { display: block; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 flex flex-col justify-between">

    <div>
        <!-- Top Announcement Bar -->
        <div class="bg-indigo-950 text-indigo-200 text-xs text-center py-2 px-4 uppercase tracking-wider font-semibold">
            Secure Test Mode Checkout Active — Free Shipping on All Orders Over $200
        </div>

        <!-- Standardized Top Navigation Bar -->
        <nav class="w-full max-w-7xl bg-white text-slate-800 shadow-md px-8 py-4 mx-auto flex flex-wrap justify-between items-center border-b border-slate-200 rounded-b-xl">
            <div class="flex items-center gap-3">
                <a href="home.html" class="font-extrabold tracking-wider text-[#1a365d] uppercase text-sm">BRI Portal</a>
            </div>
            
            <div class="flex items-center gap-6 text-sm font-semibold">
                <a href="home.html" class="text-slate-800 hover:text-amber-600 transition">Home</a>
                <div class="relative dropdown group py-2">
                    <button class="flex items-center gap-1 hover:text-amber-600 transition text-slate-800 focus:outline-none">
                        News 
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="dropdown-menu absolute hidden bg-white shadow-xl rounded-lg py-2 mt-1 w-48 border border-slate-200 z-50">
                        <a href="news.html#kansas" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Kansas</a>
                        <a href="news.html#missouri" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Missouri</a>
                        <a href="news.html#oklahoma" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Oklahoma</a>
                        <a href="news.html#arkansas" class="block px-4 py-2 text-xs text-slate-700 hover:bg-slate-100 transition">Arkansas</a>
                    </div>
                </div>
                <a href="login.html" class="text-slate-800 hover:text-amber-600 transition">Bond & Recovery Institute</a>
                <a href="store.html" class="text-[#1a365d] font-bold transition">Store</a>
                <a href="admin.html" class="text-slate-800 hover:text-amber-600 transition">Admin Hub</a>
            </div>

            <!-- Cart Trigger -->
            <div>
                <button onclick="toggleCartModal()" class="relative bg-indigo-950 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-indigo-900 transition text-xs font-bold uppercase tracking-wider">
                    <span>Cart</span>
                    <span id="cart-badge" class="bg-amber-600 text-white text-[10px] px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </nav>

        <!-- Shop Hero Banner -->
        <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white py-16 px-6 text-center shadow-inner">
            <div class="max-w-3xl mx-auto">
                <h1 class="text-4xl font-extrabold tracking-widest uppercase mb-2">Shop</h1>
                <p class="text-xs text-indigo-300 uppercase tracking-widest">Home / All Products</p>
            </div>
        </div>

        <!-- Category Filter Bar -->
        <div class="max-w-7xl mx-auto px-8 py-6 flex flex-wrap justify-center gap-3 border-b border-slate-200 bg-white shadow-sm">
            <button onclick="filterCategory('All')" class="category-btn bg-indigo-950 text-white text-xs font-bold px-6 py-2 rounded-full uppercase tracking-wider transition">All</button>
            <button onclick="filterCategory('Field Gear')" class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-6 py-2 rounded-full uppercase tracking-wider transition">Field Gear</button>
            <button onclick="filterCategory('Compliance')" class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-6 py-2 rounded-full uppercase tracking-wider transition">Compliance & Legal</button>
            <button onclick="filterCategory('Apparel')" class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-6 py-2 rounded-full uppercase tracking-wider transition">Apparel & Uniform</button>
        </div>

        <!-- Product Catalog Grid (Reflecting Layout Reference) -->
        <div class="max-w-7xl mx-auto px-8 py-10">
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <!-- Dynamic products or skeleton placeholders injected here -->
            </div>
        </div>
    </div>

    <!-- Shopping Cart Modal Drawer -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full text-slate-800 p-6 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="flex justify-between items-center border-b pb-4 mb-4">
                    <h2 class="text-lg font-bold text-[#1a365d]">Your Shopping Cart</h2>
                    <button onclick="toggleCartModal()" class="text-slate-500 hover:text-slate-800 font-bold text-lg">&times;</button>
                </div>
                <div id="cart-items" class="space-y-4 max-h-[60vh] overflow-y-auto">
                    <!-- Cart items injected here -->
                </div>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-4 text-base font-bold">
                    <span>Total:</span>
                    <span id="cart-total" class="text-indigo-950">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-[#1a365d] hover:bg-indigo-900 text-white font-bold py-3 rounded-lg shadow transition uppercase text-sm">Proceed to Checkout (Test Mode)</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-8 text-center mt-12 border-t border-slate-800">
        &copy; 2026 Bond & Recovery Institute. All rights reserved.
    </footer>

    <!-- Storefront Script -->
    <script type="module">
        import { supabase } from './supabaseClient.js';

        // Initialize Stripe Test Mode Publishable Key
        const stripe = Stripe('pk_test_TYooMQauvdEDq54NiTphI7jx');
        let allProducts = [];
        let cart = [];

        async function loadProducts() {
            const { data, error } = await supabase.from('store_products').select('*');
            const grid = document.getElementById('product-grid');
            
            if (error || !data || data.length === 0) {
                // Render structured placeholder cards matching the layout reference when no merchandise is loaded yet
                grid.innerHTML = Array(10).fill(0).map(() => `
                    <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="w-full h-40 bg-slate-100 rounded-md mb-4 flex items-center justify-center border border-dashed border-slate-300">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Placeholder Gear</span>
                            </div>
                            <span class="text-[10px] font-bold uppercase bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Standard Issue</span>
                            <h3 class="text-xs font-bold text-slate-800 mt-2">Surety Equipment Item</h3>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-sm font-extrabold text-indigo-950">$195.00</span>
                            <span class="text-[10px] text-slate-400 italic">Admin upload pending</span>
                        </div>
                    </div>
                `).join('');
                return;
            }

            allProducts = data;
            renderProducts(allProducts);
        }

        window.filterCategory = function(category) {
            // Update active pill styling
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-6 py-2 rounded-full uppercase tracking-wider transition";
            });
            event.target.className = "category-btn bg-indigo-950 text-white text-xs font-bold px-6 py-2 rounded-full uppercase tracking-wider transition";

            if (category === 'All') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="w-full h-40 bg-slate-100 rounded-md mb-4 overflow-hidden border border-slate-200">
                            <img src="${product.image_url || 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=500&auto=format&fit=crop&q=60'}" alt="${product.title}" class="w-full h-full object-cover">
                        </div>
                        <span class="text-[10px] font-bold uppercase bg-indigo-50 text-indigo-900 px-2 py-0.5 rounded border border-indigo-200">${product.category}</span>
                        <h3 class="text-xs font-bold text-slate-800 mt-2 line-clamp-1">${product.title}</h3>
                        <p class="text-[11px] text-slate-500 mt-1 line-clamp-2">${product.description || ''}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                        <span class="text-sm font-extrabold text-indigo-950">$${Number(product.price).toFixed(2)}</span>
                        <button onclick='addItemToCart(${JSON.stringify(product)})' class="bg-amber-600 hover:bg-amber-500 text-white text-[10px] font-bold px-3 py-2 rounded shadow uppercase transition">Add</button>
                    </div>
                </div>
            `).join('');
        }

        window.addItemToCart = function(product) {
            cart.push(product);
            updateCartUI();
            alert(`${product.title} added to cart.`);
        }

        window.toggleCartModal = function() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function updateCartUI() {
            document.getElementById('cart-badge').textContent = cart.length;
            const container = document.getElementById('cart-items');
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-sm text-center py-8">Your cart is empty.</p>`;
                document.getElementById('cart-total').textContent = '$0.00';
                return;
            }

            container.innerHTML = cart.map((item, index) => {
                total += Number(item.price);
                return `
                    <div class="flex justify-between items-center border-b pb-3 text-sm">
                        <div>
                            <p class="font-bold text-slate-800">${item.title}</p>
                            <p class="text-xs text-slate-500">$${Number(item.price).toFixed(2)}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-600 hover:text-red-800 text-xs font-semibold">Remove</button>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        window.checkout = async function() {
            if (cart.length === 0) {
                alert('Your cart is empty.');
                return;
            }
            alert('Initiating Stripe Test Mode Checkout gateway...');
            // Simulated successful test checkout flow
            cart = [];
            updateCartUI();
            toggleCartModal();
            alert('Test payment successful! Order confirmed.');
        }

        loadProducts();
    </script>
</body>
</html>
